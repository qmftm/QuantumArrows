name: Release

# Pushing a tag like v1.0.0 builds the mod and publishes a GitHub release with the jar attached.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Build
        run: mvn -B package

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" mod/target/quantumarrows-*.jar \
            --title "QuantumArrows ${GITHUB_REF_NAME#v}" \
            --generate-notes
